<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Vibrant Squircle Badge with transparent outside -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#brandGrad)" />
  <rect x="26" y="26" width="460" height="460" rx="118" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="4" />

  <!-- Bold, High-Contrast White Musical Double Note -->
  <g fill="#ffffff" filter="url(#shadow)">
    <ellipse cx="184" cy="350" rx="60" ry="44" transform="rotate(-25 184 350)" />
    <ellipse cx="350" cy="296" rx="60" ry="44" transform="rotate(-25 350 296)" />
    <rect x="212" y="138" width="30" height="212" rx="15" />
    <rect x="378" y="86" width="30" height="210" rx="15" />
    <polygon points="212,138 408,86 408,136 212,188" />
  </g>
</svg>
